[project]
name = "english-tutor"
version = "0.2.0"
description = "AI English tutor - conversation, vocabulary, grammar, writing (Gemini) + pronunciation (Azure)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fsrs>=5.0",
    "httpx>=0.27",
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.20,<1.24 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "onnxruntime>=1.20 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "gtts>=2.5",
    "argon2-cffi>=23",
    "boto3>=1.44.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "websockets>=13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]  # generated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
"app/seed/*" = ["E501"]
"alembic/*" = ["E501"]
"tests/*" = ["E501"]
"scripts/*" = ["E702", "E501"]
